<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ячейки для хранения вещей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <button class="back" id="backBtn" type="button" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="step" id="stepLabel">Шаг 1 из 4</span>
      <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
    </header>
    <main class="screen" id="screen" tabindex="-1"></main>
    <footer class="bottombar" id="bottombar" hidden>
      <button class="btn primary" id="mainBtn" type="button">Дальше</button>
    </footer>
  </div>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
